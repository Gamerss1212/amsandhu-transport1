name: Backtest AI Clipper on Windows

# Runs the real AIClipper.exe end to end (trends -> YouTube discovery/download -> judge -> edit)
# whenever ai-clipper/packaging/backtest-request.txt changes.
on:
  push:
    paths: ["ai-clipper/packaging/backtest-request.txt"]
  workflow_dispatch:

env:
  LEVEL: professional
  MAX_MINUTES: "40"

jobs:
  backtest:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ai-clipper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-clipper/requirements.txt

      - name: Build AIClipper.exe
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean AIClipper.spec

      - name: Clip real videos with the exe (no keys)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          $exe = ".\dist\AIClipper\AIClipper.exe"
          & $exe doctor *>&1 | Tee-Object -FilePath doctor.log
          $interview = "https://archive.org/details/George_Soros_1998_60_Minutes_Interview"
          $comedy = "https://archive.org/download/Norm_Macdonald_Live/Norm%20Macdonald%20Live%20-%20S01E02%20-%20Norm%20Macdonald%20with%20Guest%20Tom%20Green.mp4"
          # 3 clips from a 13-minute interview at the highest level (built-in music, whoosh and b-roll)
          & $exe clip $interview --clips 3 --level extreme *>&1 | Tee-Object -FilePath clip_interview.log
          # the best 4 clips pooled across two videos (the interview is already analyzed)
          & $exe clip $interview $comedy --clips 4 --level $env:LEVEL *>&1 | Tee-Object -FilePath clip_pooled.log
          exit 0

      - name: Full one-button run with the exe (no keys)
        shell: pwsh
        run: |
          $cfg = @"
          discovery:
            max_duration_minutes: $env:MAX_MINUTES
            max_videos_per_run: 2
          "@
          Set-Content -Path dist\AIClipper\config.yaml -Value $cfg
          $env:PYTHONIOENCODING = "utf-8"
          .\dist\AIClipper\AIClipper.exe run --clips 2 --level $env:LEVEL *>&1 | Tee-Object -FilePath backtest.log
          exit 0

      - name: Collect results
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          Copy-Item *.log results\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse dist\AIClipper\output results\output -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse dist\AIClipper\data\work -Include analysis.json,info.json -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName ("results\" + $_.Directory.Name + "_" + $_.Name) }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: ai-clipper/results
