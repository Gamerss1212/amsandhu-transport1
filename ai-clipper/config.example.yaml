# AI Clipper configuration. Copy to config.yaml and edit.
# API keys go in .env (see .env.example), never in this file.

# ---------------------------------------------------------------- Step 1
trends:
  # The run stops if fewer than this many short-form videos were analyzed.
  min_videos: 350
  # Paid, optional (needs APIFY_TOKEN): fresh TikTok/Instagram videos per platform per run.
  fetch_per_platform: 600
  # Only videos from the last N days count toward the analysis.
  lookback_days: 30
  # Top fraction (by virality score) labelled "viral"; bottom fraction labelled "flop".
  viral_top_fraction: 0.2
  flop_bottom_fraction: 0.4
  platforms: [tiktok, instagram]
  tiktok:
    actor: clockworks~tiktok-scraper
    hashtags: [podcast, podcastclips, interview, motivation, storytime, comedy, fyp]
    search_queries: [podcast clip, viral interview moment, funny podcast]
    actor_input: {}          # extra/override input passed straight to the Apify actor
  instagram:
    actor: apify~instagram-hashtag-scraper
    hashtags: [podcastclips, podcast, interviewclips, motivation, reels]
    actor_input: {}
  # Free sources - no key needed. Collected with yt-dlp on every run.
  free:
    enabled: true
    # Big creators whose Shorts are studied (YouTube handles, without the @).
    youtube_channels: [TheDiaryOfACEO, TheoVon, PBDPodcast, CallHerDaddy, ShawnRyanShow, ChrisWillx,
                       hubermanlab, FirstWeFeast, SteveWillDoIt, alexhormozi, GaryVee, jubilee,
                       MrBeast, colinandsamir]
    youtube_hashtags: [podcast, podcastclips, interview, motivation, storytime, comedy]
    youtube_searches: [podcast clip, viral interview moment, funny podcast moment, storytime podcast,
                       motivational speech clip]
    # TikTok usernames (without the @). TikTok blocks many connections; if it works on yours, these
    # videos are analyzed too.
    tiktok_creators: []
    per_source: 120            # newest Shorts taken from each source
    workers: 3                 # parallel requests (keep low: too many makes YouTube block downloads)
    max_details: 120           # new videos per run whose likes/comments/date are read (one request each)
    max_detail_minutes: 4      # time budget for those detail reads
  # Also load any .json / .csv exports dropped in this folder (any source works).
  import_dir: data/trend_imports

# ---------------------------------------------------------------- Step 2
discovery:
  # Channels to watch in real time (channel IDs start with UC...).
  watch_channels: []
  #  - UCzQUP1qoWDoEbmsQxvdjxgQ   # example
  search_queries: [podcast full episode, podcast episode interview, comedy podcast full episode]
  # Skip videos whose title contains any of these (news broadcasts, music, etc. make poor clips).
  exclude_title_words: [news, broadcast, nightly, good morning america, live stream, livestream, full game,
                        audiobook, full movie, full album, sermon, asmr, sleep music, white noise]
  use_trending_chart: true       # YouTube "most popular" chart (very cheap on quota)
  region_code: US
  language: en
  min_duration_minutes: 10       # shortest video to clip from
  max_duration_minutes: 12000    # longest: 200 hours (streams, marathons) - over 3 h only the audio is downloaded
  published_within_days: 14
  min_views: 100000
  max_videos_per_run: 8          # most long videos to watch per click while collecting your clips
  watch_interval_minutes: 10     # real-time RSS polling interval for the web app

analysis:
  # If YouTube says "Sign in to confirm you're not a bot", let yt-dlp use your browser's
  # YouTube login: set cookies_from_browser to chrome / firefox / edge / brave / safari,
  # or point cookies_file at an exported cookies.txt.
  cookies_from_browser: null
  cookies_file: null
  whisper_model: small           # tiny/base/small/medium/large-v3 (bigger = more accurate, slower)
  whisper_device: auto           # auto/cpu/cuda
  long_video_hours: 1.5          # longer videos (up to 30 h+) are watched in high-speed mode
  long_video_model: base         # lighter speech model used past 6 hours (when the video has no captions)
  chunk_minutes: 18              # transcript window sent to the AI per request
  min_clip_seconds: 20
  max_clip_seconds: 75
  max_clips_per_video: 6
  candidates_per_chunk: 6
  # Strictness: a clip must reach BOTH scores (0-100) to be delivered.
  judge_threshold: 82
  fused_threshold: 70
  # Used when there is no ANTHROPIC_API_KEY (built-in judge, no AI service needed).
  local_content_threshold: 72
  local_fused_threshold: 64
  local_band: 6                  # also must score within this many points of the video's best moment
  judge_with_frames: true        # show the AI judge real frames from each candidate
  use_comments: true             # mine YouTube comments for "12:34 was insane"-style timestamps
  max_comment_pages: 5
  weights:                       # how the final score blends signals
    ai: 0.45
    heatmap: 0.20                # YouTube "most replayed" graph
    comments: 0.10
    energy: 0.10
    trend_fit: 0.15              # match with what is going viral right now

# ---------------------------------------------------------------- Step 3
editing:
  default_level: auto            # auto = the app picks the edit each clip needs (or simple | normal | hard | professional | extreme)
  clips_per_run: 5               # how many finished clips you want per click (they can come from different videos)
  width: 1080
  height: 1920
  fps: 30
  font: Poppins ExtraBold        # bundled; or any font you drop into assets/fonts (use its name)
  fonts_dir: assets/fonts
  music_dir: assets/music        # royalty-free tracks (.mp3/.wav) for professional+
  sfx_dir: assets/sfx            # whoosh/pop sounds for professional+
  broll_dir: assets/broll        # satisfying/gameplay footage for extreme split-screen
  builtin_assets: true           # built-in music, whoosh and b-roll when the folders below are empty
  censor_profanity: true         # star out explicit words on screen and in captions (f*ck) - platforms limit reach
  accent_color: "#FFE600"
  highlight_color: "#00FF88"

llm:
  model: claude-opus-5
  effort: high                   # low | medium | high | xhigh | max
  judge_effort: xhigh

paths:
  work_dir: data/work
  output_dir: output
  db: data/clipper.db
